# musicfx.conf - describes this project to tools/check.sh and tools/record.sh. Shell syntax: no spaces around "=".

NAME=demo_mfx                               # program name inside dist/
SOURCES="kit/sys.c kit/mfx.c kit/mfx_cfg.s kit/mixer/mixer.asm kit/ptplayer/ptplayer.asm examples/demo_mfx.c"
CFLAGS="-Ikit"
CONFIG_DIR=examples                         # the folder that holds this project's mixer_config.i

# The effects mixer. These three override the same names in mixer_config.i and steer tools/sfx.py.
HQ=1                                        # 1: effects keep all 8 bits (costs CPU). 0: divided by VOICES (cheap)
VOICES=4                                    # effects that can sound at once (1-4)
PERIOD=322                                  # mixer rate = 3546895 / PERIOD Hz on PAL: 322 = 11015 Hz, 161 = 22030 Hz

EFFECTS="examples/fx/*.wav"                 # source effects (WAV); converted into assets/fx/*.raw
GAIN=1.0                                    # loudness of the converted effects

# Gates of the referee.
FRAMES=150                                  # frames per bench phase
MAX_CPU_PCT=15                              # audio may take this much of an Amiga 500 with all voices busy
